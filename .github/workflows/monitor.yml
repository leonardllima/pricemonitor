name: Monitor de preços

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas (horário UTC)
  workflow_dispatch:
    inputs:
      resumo:
        description: "Enviar resumo dos preços atuais no Telegram"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  monitorar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Coletar preços
        run: python monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENVIAR_RESUMO: ${{ github.event.inputs.resumo }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}   # opcional

      - name: Salvar histórico no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.csv 2>/dev/null || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Preços $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
