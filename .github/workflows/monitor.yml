name: Monitor de preços

on:
  schedule:
    # De hora em hora. O agendamento do GitHub atrasa e às vezes PULA disparos,
    # então são 3 por hora: o primeiro que chegar roda; os outros são ignorados
    # pelo intervalo.py (mínimo de 45 min entre consultas, ver config.json).
    # Horário em UTC; os minutos fogem do ":00", que é o horário mais congestionado.
    - cron: "7 * * * *"
    - cron: "27 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      resumo:
        description: "Enviar a mensagem mesmo sem mudanças"
        type: boolean
        default: true
      forcar:
        description: "Rodar mesmo se a última consulta foi há menos de 45 min"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:            # evita duas execuções ao mesmo tempo
  group: monitor-precos
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-24.04     # fixo: o ubuntu-latest está migrando para o 26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verificar intervalo desde a última consulta
        id: intervalo
        run: python intervalo.py
        env:
          FORCAR: ${{ github.event.inputs.forcar }}

      - name: Instalar dependências
        if: steps.intervalo.outputs.rodar == 'true'
        run: pip install -r requirements.txt

      - name: Instalar Chrome (para sites com desafio de JavaScript)
        if: steps.intervalo.outputs.rodar == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Testes automáticos
        if: steps.intervalo.outputs.rodar == 'true'
        run: python -m unittest discover -s tests -v

      - name: Buscar e coletar preços
        if: steps.intervalo.outputs.rodar == 'true'
        run: python monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}   # opcional
          ENVIAR_RESUMO: ${{ github.event.inputs.resumo }}

      - name: Salvar histórico e links descobertos
        if: steps.intervalo.outputs.rodar == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.csv estado.json 2>/dev/null || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Preços $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
