name: Monitor de preços

on:
  schedule:
    - cron: "17 * * * *"   # a cada hora, no minuto 17
  workflow_dispatch:
    inputs:
      resumo:
        description: "Enviar a mensagem mesmo sem mudanças"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:            # evita duas execuções ao mesmo tempo
  group: monitor-precos
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Instalar Chrome (para sites com desafio de JavaScript)
        run: python -m playwright install --with-deps chromium

      - name: Testes automáticos
        run: python -m unittest discover -s tests -v

      - name: Coletar preços
        run: python monitor.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}   # opcional
          ENVIAR_RESUMO: ${{ github.event.inputs.resumo }}

      - name: Salvar histórico no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.csv 2>/dev/null || true
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Preços $(date -u '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git pull --rebase && git push && exit 0
            sleep 5
          done
          exit 1
